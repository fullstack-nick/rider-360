[project]
name = "rider-360"
version = "0.1.0"
description = "A fictional, synthetic end-to-end rider journey analytics platform."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Rider 360" }]
dependencies = [
  "dagster==1.13.17",
  "dagster-dbt==0.29.17",
  "dagster-gcp==0.29.17",
  "dagster-postgres[gcp]==0.29.17",
  "dagster-webserver==1.13.17",
  "dbt-bigquery==1.12.0",
  "google-cloud-bigquery==3.43.0",
  "google-cloud-storage==3.1.1",
  "numpy==2.3.4",
  "pandas>=2.3,<3",
  "plotly>=6.3,<7",
  "polars==1.43.2",
  "psycopg[binary]>=3.3,<4",
  "pyarrow==25.0.0",
  "pydantic==2.13.4",
  "pyyaml>=6.0.2,<7",
  "requests>=2.32,<3",
  "rich>=14.2,<15",
  "scikit-learn==1.9.0",
  "sqlalchemy>=2.0.46,<3",
  "statsmodels==0.14.6",
  "tenacity>=9.1,<10",
  "typer==0.27.1",
]

[project.scripts]
rider360 = "rider360.cli:app"

[dependency-groups]
dev = [
  "ipykernel>=7,<8",
  "matplotlib>=3.10,<4",
  "nbconvert>=7.16,<8",
  "pytest==9.1.1",
  "pytest-cov>=7.0,<8",
  "ruff==0.16.2",
]

[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rider360"]

[tool.dagster]
module_name = "rider360.orchestration.definitions"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: requires Docker or cloud services",
  "warehouse: requires an isolated BigQuery target",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
